<!DOCTYPE html>

    <title>Exemplo - Exercício Desvio Condicional - Validação Número</title>

</head>
<body>
    <div class = "container">
        <h1>Validação de números </h1>

     </div>
     <script src="script.js"></script> <!--importa o arquivo JS-->
</body>
