<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Painel de Saúde 2.0</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Painel de Saúde 2.0</h1>

        <!-- =========================================================
        1. FORMULÁRIO DE CADASTRO DO PACIENTE
        ========================================================= -->

        <!-- ID para identificar o formulário -->
        <form id="form-paciente">

            <!-- Campo Nome -->
            <div class="campo">
                <label for="nome">Nome:</label>

                <!-- ID "nome" -->
                <input
                    type="text"
                    id="nome"
                    placeholder="Ex: Maria Silva"
                    required
                >
            </div>

            <!-- Campo Altura -->
            <div class="campo">
                <label for="altura">Altura (m):</label>

                <!-- type number e step 0.01 para aceitar altura decimal -->
                <input
                    type="number"
                    id="altura"
                    step="0.01"
                    placeholder="Ex: 1.65"
                    required
                >
            </div>

            <!-- Campo Peso -->
            <div class="campo">
                <label for="peso">Peso (kg):</label>

                <!-- ID "peso" e step 0.1 -->
                <input
                    type="number"
                    id="peso"
                    step="0.1"
                    placeholder="Ex: 68.5"
                    required
                >
            </div>

            <!-- submit faz o envio do formulário -->
            <button type="submit">
                Cadastrar Paciente
            </button>

        </form>

        <!-- =========================================================
        2. TABELA DE RELATÓRIO DE PACIENTES
        ========================================================= -->

        <section class="tabela-container">

            <h2>Relatório de Indicadores</h2>

            <table>

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Altura (m)</th>
                        <th>Peso (kg)</th>
                        <th>IMC</th>
                        <th>Classificação</th>
                    </tr>
                </thead>

                <!-- ID usado pelo JavaScript para inserir as linhas -->
                <tbody id="tabela-pacientes">

                    <!-- As linhas serão inseridas pelo JavaScript -->

                </tbody>

            </table>

        </section>

    </main>

    <!-- adiciona o arquivo JavaScript -->
    <script src="script.js"></script>

</body>

</html>
